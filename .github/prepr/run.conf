# What a push to ci/pre-pr-check runs. (Run by hand from the Actions tab and
# the form's values are used instead.)
#
# REF      branch under review
# BASE     branch the PR targets; the merge base with it is the comparison
# WHAT     all, or any of: tests compile linux android tpk
#            tests    tests/*.sh that compile a changed file, branch vs base
#            compile  strict syntax check of every C file per platform
#            linux    Linux desktop build, branch vs base
#            android  Android debug build + Kotlin unit tests (best effort)
#            tpk      starts "Build TPK" for REF (the normal .tpk build; that
#                     workflow is untouched and still runs alone as before)
# PACOTES  packages for tpk
REF=subtitle-rewrite
BASE=master
WHAT=tests compile linux android
PACOTES=NuvioTpk40 NuvioTpk60 NuvioTpk65 NuvioTpk
